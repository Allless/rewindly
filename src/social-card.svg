         -pointsize 104 -fill '#23201b' -gravity North -annotate +0+330 'Rewindly' \
         -font "/System/Library/Fonts/Supplemental/Georgia.ttf" \
         -pointsize 37 -fill '#77705f' -annotate +0+468 \
         'Your Telegram, rewound — 100% in your browser' \
         -depth 8 src/public/social-card.png -->
