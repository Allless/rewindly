name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Commit-free redeploys (gh workflow run deploy.yml).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Split from deploy so a rerun of a failed deploy reuses the uploaded
  # artifact instead of uploading a duplicate (which deploy-pages rejects).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          VITE_TG_API_ID: ${{ secrets.VITE_TG_API_ID }}
          VITE_TG_API_HASH: ${{ secrets.VITE_TG_API_HASH }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # The Pages queue has been seen stalling past the 10-minute default,
          # but deploy-pages caps the timeout at 10 minutes anyway — state the
          # real value instead of a silently ignored one.
          timeout: 600000
